name: Build Native

on:
  workflow_dispatch:
  push:
    branches:
      - s390-GHA
    paths:
      - 'src/main/resources/org/xerial/snappy/VERSION'
      - 'Makefile'
      - 'Makefile.common'
      - '**/*.h'
      - '**/*.cpp'
      - .github/workflows/build-native.yml
  pull_request:
    paths:
      - 'src/main/resources/org/xerial/snappy/VERSION'
      - 'Makefile'
      - 'Makefile.common'
      - '**/*.h'
      - '**/*.cpp'

jobs:
  build:
    strategy:
      matrix:
        platform: [self-hosted]
    permissions:
      contents: write
      pull-requests: write
    name: Build native libraries
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - uses: actions/checkout@v6
      - name: Build native libraries
        run: sudo apt update && sudo apt-get remove cmake cmake-data && sudo apt install -y cmake curl gcc g++ && export CMAKE_ROOT=/usr/share/cmake && make clean-native native-all
        env:
          OCI_EXE: docker
      - name: Create Pull Request
        if: ${{ github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v8
        with:
          title: Update native libraries
          commit-message: Update native libraries for ${{ github.sha }}
          branch: update-native-libs
          labels: library-update
